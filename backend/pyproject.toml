[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dsir-backend"
version = "1.0.0"
description = "DSir Backend - AI-powered programming education platform"
authors = [{name = "DSir Team"}]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "gunicorn>=22,<24",
    "sqlalchemy[asyncio]>=2.0.30,<2.1",
    "psycopg[binary]>=3.1,<4.0",
    "alembic>=1.13,<2.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "python-jose[cryptography]>=3.3,<4.0",
    "passlib[argon2]>=1.7,<2.0",
    "python-multipart>=0.0.9,<1.0",
    "redis>=5.0,<6.0",
    "httpx>=0.27,<1.0",
    "python-dotenv>=1.0,<2.0",
    "email-validator>=2.1,<3.0",
    "tenacity>=8.0,<10.0",
    "structlog>=24.0,<25.0",
    "cryptography>=42,<45",
    "google-generativeai>=0.8,<1.0",
    "pdfplumber>=0.10,<1.0",
    "PyPDF2>=3.0,<4.0",
    "Pillow>=10.0,<12.0",
    "safety>=2.0,<3.0",
    # Observability & Monitoring
    "opentelemetry-api>=1.20,<2.0",
    "opentelemetry-sdk>=1.20,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.42b,<1.0",
    "opentelemetry-instrumentation-sqlalchemy>=0.42b,<1.0",
    "opentelemetry-instrumentation-redis>=0.42b,<1.0",
    "opentelemetry-exporter-prometheus>=1.20,<2.0",
    "prometheus-client>=0.19,<1.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.8,<2.0",
    "ruff>=0.4.0,<0.5.0",
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<0.24",
    "httpx>=0.27,<1.0",
    "factory-boy>=3.3,<4.0",
    "faker>=24.0,<25.0",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_return_any_from_none = true
ignore_missing_imports = true
follow_imports = "silent"
show_error_codes = true
pretty = true
strict_equality = true

[tool.ruff]
select = ["E", "F", "W", "C", "N", "I"]
ignore = [
    "E501",  # Line length handled by Black
    "E203",  # Whitespace before ':' handled by Black
    "W503",  # Line break before binary operator handled by Black
    "N806",  # Constant in function - sometimes needed for tests
]
line-length = 88
target-version = "py312"
extend-exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    ".venv",
    "venv",
    ".mypy_cache",
    ".ruff_cache",
    "alembic/versions/*",  # Alembic migrations
]

[tool.ruff.format]
quote-style = "double"
indent-width = 4

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--disable-warnings",
    "--tb=short",
]
asyncio_mode = "auto"
log_cli = true
log_cli_level = "INFO"

[tool.coverage.run]
branch = true
source = ["app"]
omit = [
    "*/migrations/*",
    "*/__init__.py",
    "*/tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if self?.debug",
    "if settings.DEBUG",
    "if settings.TESTING",
]
show_missing = true
skip_covered = false