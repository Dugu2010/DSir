<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230B1729'/><path d='M9 22V10h3.5l3.5 8 3.5-8H23v12h-2.5v-7l-3 7h-2l-3-7v7H9z' fill='%23FF5C39'/></svg>" />
    <title>Academy — Learn. Build. Ship.</title>
    <meta name="description" content="Live cohorts, mentorship, and courses." />
    <meta name="theme-color" content="#0a0f1a" />

    <style>
      /* ═════════════════════════════════════════════════
         DARK MODE — Production-ready overrides
         Preserves all layout/interaction, only inverts colors
         ═════════════════════════════════════════════════ */

      :root {
        --dm-bg:        #080d18;
        --dm-surface:   #111827;
        --dm-surface2:  #1a2236;
        --dm-surface3:  #232d42;
        --dm-border:    #2a3550;
        --dm-border-sub:#1f2a3d;
        --dm-text:      #e4e9f2;
        --dm-text-muted:#96a3bd;
        --dm-text-dim:  #64708a;
        --dm-accent:    #ff5c39;
        --dm-accent-glow:rgba(255,92,57,.35);
        --dm-blue:      #60a5fa;
        --dm-green:     #4ade80;
        --dm-red:       #f87171;
      }

      /* ── Reset base border color ── */
      *,:before,:after { border-color: var(--dm-border) }

      /* ── Body ── */
      body {
        background-color: var(--dm-bg) !important;
        color: var(--dm-text) !important;
      }
      html { background: var(--dm-bg) }

      /* ── Scrollbar ── */
      ::-webkit-scrollbar { width: 8px }
      ::-webkit-scrollbar-track { background: var(--dm-bg) }
      ::-webkit-scrollbar-thumb { background: var(--dm-border); border-radius: 999px }
      ::-webkit-scrollbar-thumb:hover { background: var(--dm-text-dim) }

      /* ── Selection ── */
      ::selection { background: rgba(255,92,57,.3); color: #fff }

      /* ═══ COLOR TOKEN OVERRIDES ═══ */

      /* bg-paper → dark bg */
      .bg-paper,
      [class*="bg-paper"] {
        background-color: var(--dm-bg) !important;
      }
      .bg-paper\/95,
      [class*="bg-paper\/95"] {
        background-color: rgba(8,13,24,.95) !important;
      }
      .bg-paper-light,
      [class*="bg-paper-light"] {
        background-color: var(--dm-surface2) !important;
      }

      /* bg-white → dark surface */
      .bg-white,
      [class*="bg-white"] {
        background-color: var(--dm-surface) !important;
      }
      .bg-white\/10,
      [class*="bg-white\/10"] {
        background-color: rgba(255,255,255,.05) !important;
      }
      .bg-white\/15,
      [class*="bg-white\/15"] {
        background-color: rgba(255,255,255,.08) !important;
      }
      .bg-white\/80,
      [class*="bg-white\/80"] {
        background-color: rgba(17,24,39,.85) !important;
      }
      .bg-white\/90,
      [class*="bg-white\/90"] {
        background-color: rgba(17,24,39,.95) !important;
      }

      /* bg-gray-* → dark */
      .bg-gray-50,
      [class*="bg-gray-50"] {
        background-color: var(--dm-surface) !important;
      }
      .bg-gray-100,
      [class*="bg-gray-100"] {
        background-color: var(--dm-surface2) !important;
      }
      .bg-\[\#F8F9FB\],
      .bg-\[\#F8FAFC\],
      .bg-\[\#FAFBFC\],
      .bg-\[\#F1F5F9\] {
        background-color: var(--dm-surface) !important;
      }

      /* bg-ink → stays dark but slightly different */
      .bg-ink,
      [class*="bg-ink"] {
        background-color: var(--dm-bg) !important;
      }
      .bg-ink\/10,
      [class*="bg-ink\/10"] {
        background-color: rgba(255,255,255,.05) !important;
      }

      /* bg rule */
      .bg-rule,
      [class*="bg-rule"] {
        background-color: var(--dm-border) !important;
      }

      /* bg-blue-50 → dark */
      .bg-blue-50,
      .bg-\[\#EBF4FF\] {
        background-color: rgba(59,130,246,.12) !important;
      }
      .bg-red-50,
      .bg-\[\#FFF0F0\] {
        background-color: rgba(248,113,113,.12) !important;
      }
      .bg-\[\#EDFAF1\] {
        background-color: rgba(74,222,128,.12) !important;
      }
      .bg-\[\#EDFCFD\] {
        background-color: rgba(6,182,212,.12) !important;
      }
      .bg-\[\#F3EEFF\] {
        background-color: rgba(124,58,237,.12) !important;
      }
      .bg-\[\#FFF4EB\] {
        background-color: rgba(255,92,57,.12) !important;
      }

      /* ── Text ── */
      .text-ink,
      [class*="text-ink"] {
        color: var(--dm-text) !important;
      }
      .lede {
        color: rgba(228,233,242,.75) !important;
      }

      /* Display headings */
      .display-h1,
      .display-h2,
      .display-h3 {
        color: var(--dm-text) !important;
      }

      /* ── Borders ── */
      .border-ink,
      [class*="border-ink"] {
        border-color: var(--dm-border) !important;
      }
      .border-ink\/40,
      [class*="border-ink\/40"] {
        border-color: rgba(42,53,80,.6) !important;
      }
      .border-rule,
      [class*="border-rule"] {
        border-color: var(--dm-border) !important;
      }
      .border-rule\/60,
      [class*="border-rule\/60"] {
        border-color: rgba(42,53,80,.7) !important;
      }
      .border-paper,
      [class*="border-paper"] {
        border-color: var(--dm-border) !important;
      }
      .border-paper\/10,
      [class*="border-paper\/10"] {
        border-color: rgba(42,53,80,.4) !important;
      }
      .border-paper\/15,
      [class*="border-paper\/15"] {
        border-color: rgba(42,53,80,.5) !important;
      }
      .border-paper\/20,
      [class*="border-paper\/20"] {
        border-color: rgba(42,53,80,.55) !important;
      }
      .border-paper\/30,
      [class*="border-paper\/30"] {
        border-color: rgba(42,53,80,.65) !important;
      }
      .border-paper-light,
      [class*="border-paper-light"] {
        border-color: var(--dm-border-sub) !important;
      }
      .border-white\/20 {
        border-color: rgba(255,255,255,.08) !important;
      }
      .border-gray-200,
      .border-\[\#E2E8F0\],
      .border-\[\#E8ECF2\],
      .border-\[\#F1F5F9\],
      .border-\[\#CBD5E1\] {
        border-color: var(--dm-border) !important;
      }
      .border-gray-300 {
        border-color: var(--dm-border) !important;
      }
      .border-blue-200 {
        border-color: rgba(96,165,250,.3) !important;
      }
      .border-red-200 {
        border-color: rgba(248,113,113,.3) !important;
      }

      /* ── Divides ── */
      .divide-ink\/10 > :not([hidden]) ~ :not([hidden]),
      [class*="divide-ink"] > :not([hidden]) ~ :not([hidden]) {
        border-color: rgba(42,53,80,.4) !important;
      }
      .divide-paper\/10 > :not([hidden]) ~ :not([hidden]),
      [class*="divide-paper"] > :not([hidden]) ~ :not([hidden]) {
        border-color: rgba(42,53,80,.35) !important;
      }
      .divide-\[\#F1F5F9\] > :not([hidden]) ~ :not([hidden]) {
        border-color: var(--dm-border) !important;
      }

      /* ── Rule element ── */
      .rule {
        background-color: var(--dm-border) !important;
      }

      /* ── Buttons ── */
      .btn-primary {
        background-color: var(--dm-accent) !important;
        color: #fff !important;
      }
      .btn-primary:hover {
        background-color: #e8481e !important;
        box-shadow: 0 14px 30px -12px var(--dm-accent-glow) !important;
      }

      .btn-coral {
        background-color: var(--dm-accent) !important;
        color: #fff !important;
      }
      .btn-coral:hover {
        background-color: #e8481e !important;
        box-shadow: 0 14px 30px -12px var(--dm-accent-glow) !important;
      }

      .btn-outline {
        border-color: rgba(228,233,242,.25) !important;
        color: var(--dm-text) !important;
      }
      .btn-outline:hover {
        border-color: var(--dm-text) !important;
        background-color: var(--dm-text) !important;
        color: var(--dm-bg) !important;
      }

      .btn-paper {
        background-color: var(--dm-surface) !important;
        color: var(--dm-text) !important;
      }
      .btn-paper:hover {
        background-color: var(--dm-accent) !important;
        color: #fff !important;
      }

      .btn-wa {
        background-color: #22c55e !important;
      }
      .btn-wa:hover {
        background-color: #1ea34e !important;
      }

      /* ── Chips ── */
      .chip {
        border-color: var(--dm-border) !important;
        background-color: rgba(26,34,54,.5) !important;
        color: var(--dm-text-muted) !important;
      }
      .chip-ink {
        border-color: var(--dm-border) !important;
        background-color: var(--dm-surface3) !important;
        color: var(--dm-text) !important;
      }
      .chip-coral {
        background-color: var(--dm-accent) !important;
        border-color: var(--dm-accent) !important;
        color: #fff !important;
      }
      .chip-mint {
        border-color: rgba(74,222,128,.3) !important;
        background-color: rgba(74,222,128,.15) !important;
        color: var(--dm-text) !important;
      }

      /* ── Form fields ── */
      .field {
        border-color: var(--dm-border) !important;
        color: var(--dm-text) !important;
      }
      .field::placeholder {
        color: var(--dm-text-dim) !important;
      }
      .field:focus {
        border-color: var(--dm-text) !important;
      }

      /* ── Input overrides ── */
      input::placeholder,
      textarea::placeholder {
        color: var(--dm-text-dim) !important;
      }

      /* ── Cards & containers with inline styles/bg ── */
      .border-t-coral {
        border-top-color: var(--dm-accent) !important;
      }

      /* ── Gradients ── */
      .bg-gradient-to-t,
      [class*="bg-gradient-to-t"] {
        --tw-gradient-from: rgba(8,13,24,.9) var(--tw-gradient-from-position) !important;
        --tw-gradient-to: rgba(8,13,24,0) var(--tw-gradient-to-position) !important;
      }
      .from-ink\/60 {
        --tw-gradient-from: rgba(8,13,24,.7) var(--tw-gradient-from-position) !important;
      }
      .from-ink\/85 {
        --tw-gradient-from: rgba(8,13,24,.9) var(--tw-gradient-from-position) !important;
      }
      .via-ink\/10 {
        --tw-gradient-stops: var(--tw-gradient-from), rgba(8,13,24,.15) var(--tw-gradient-via-position), var(--tw-gradient-to) !important;
      }

      /* ── Admin shell overrides ── */
      .admin-shell,
      .admin-modal {
        --admin-page-bg: var(--dm-bg);
        --admin-card-bg: var(--dm-surface);
        --admin-text-1: var(--dm-text);
        --admin-text-2: var(--dm-text-muted);
        --admin-text-3: var(--dm-text-dim);
        --admin-border: var(--dm-border-sub);
        --admin-input-border: var(--dm-border);
        --admin-blue-bg: rgba(96,165,250,.15);
        --admin-blue: #60a5fa;
        --admin-blue-hover: rgba(96,165,250,.25);
        font-family: Plus Jakarta Sans, DM Sans, system-ui, sans-serif;
        color: var(--admin-text-1);
      }
      .admin-shell .admin-input,
      .admin-modal .admin-input,
      .admin-input {
        background: var(--dm-surface) !important;
        color: var(--dm-text) !important;
        border-color: var(--dm-border) !important;
      }
      .admin-input:focus {
        border-color: var(--dm-blue) !important;
      }
      .admin-label {
        color: var(--dm-text-muted) !important;
      }

      /* ── Misc dark fixes ── */
      .text-gray-200 { color: var(--dm-text-dim) !important; }
      .text-gray-300 { color: var(--dm-text-dim) !important; }
      .text-gray-400 { color: var(--dm-text-dim) !important; }
      .text-gray-500 { color: var(--dm-text-muted) !important; }
      .text-gray-600 { color: var(--dm-text-muted) !important; }
      .text-gray-700 { color: var(--dm-text) !important; }
      .text-gray-800 { color: var(--dm-text) !important; }
      .text-gray-900 { color: #f0f4f8 !important; }

      .bg-black\/30 {
        background-color: rgba(0,0,0,.6) !important;
      }

      /* ring focus offset */
      .btn-primary:focus-visible,
      .btn-coral:focus-visible,
      .btn-outline:focus-visible,
      .btn-paper:focus-visible {
        --tw-ring-color: rgba(255,92,57,.6) !important;
        --tw-ring-offset-color: var(--dm-bg) !important;
      }

      /* ── h1-h6 (reset) ── */
      h1,h2,h3,h4,h5,h6 { color: inherit }

      /* ── Links ── */
      a { color: inherit }

      /* ── Code blocks ── */
      pre, code, kbd, samp {
        color: var(--dm-text-muted);
      }

      /* ── Smooth transitions for color changes ── */
      body, .bg-paper, .bg-white, .bg-ink, .text-ink,
      .btn-primary, .btn-coral, .btn-outline, .btn-paper,
      .chip, .field, .rule, .border-ink, .border-rule, .border-paper {
        transition: background-color .25s ease, border-color .25s ease, color .25s ease;
      }

      /* ── Remove any ring offset white defaults ── */
      --tw-ring-offset-color: var(--dm-bg);

      /* ═══════════════════════════════════════════
         BRIDGE NAV — connects landing → DSir app
         ═══════════════════════════════════════════ */
      #dsir-bridge {
        position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
        height: 52px;
        display: flex; align-items: center; justify-content: space-between;
        padding: 0 20px;
        background: rgba(8,13,24,.92);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-bottom: 1px solid var(--dm-border);
        font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      }
      #dsir-bridge .brand {
        display: flex; align-items: center; gap: 8px;
        font-family: Fraunces, Georgia, serif;
        font-weight: 700; font-size: 18px; color: var(--dm-text);
        text-decoration: none; letter-spacing: -.02em;
      }
      #dsir-bridge .brand svg { width: 24px; height: 24px; flex-shrink: 0; }
      #dsir-bridge .actions { display: flex; align-items: center; gap: 8px; }
      #dsir-bridge .btn-sm {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 6px 14px; border-radius: 999px;
        font-size: 13px; font-weight: 600;
        text-decoration: none; white-space: nowrap;
        transition: all .2s ease;
        cursor: pointer; border: none;
      }
      #dsir-bridge .btn-ghost {
        color: var(--dm-text-muted); background: transparent;
      }
      #dsir-bridge .btn-ghost:hover { color: var(--dm-text); background: rgba(255,255,255,.06); }
      #dsir-bridge .btn-fill {
        background: var(--dm-accent); color: #fff;
      }
      #dsir-bridge .btn-fill:hover { background: #e8481e; box-shadow: 0 4px 16px rgba(255,92,57,.3); }
      /* Push React root down below bridge */
      #root { padding-top: 52px; }
    </style>
  </head>
  <body class="bg-paper text-ink">
    <!-- 🌉 Bridge nav — seamless jump from landing to the DSir web app -->
    <header id="dsir-bridge" aria-label="Site navigation">
      <a href="/" class="brand" aria-label="DSir Academy home">
        <svg viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="8" fill="var(--dm-surface)"/><path d="M9 22V10h3.5l3.5 8 3.5-8H23v12h-2.5v-7l-3 7h-2l-3-7v7H9z" fill="var(--dm-accent)"/></svg>
        DSir Academy
      </a>
      <nav class="actions" aria-label="Account actions">
        <a href="/login" class="btn-sm btn-ghost">Sign In</a>
        <a href="/signup" class="btn-sm btn-fill">Get Started Free</a>
      </nav>
    </header>
    <div id="root"></div>
  </body>
</html>
