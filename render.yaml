services:
  - type: web
    name: dsir-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.seed && gunicorn app.main:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dsir-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: dsir-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: CORS_ORIGINS
        value: '["https://dsir.vercel.app","http://localhost:3000"]'
      - key: ENVIRONMENT
        value: production
      - key: AI_DEFAULT_PROVIDER
        value: nvidia
      - key: AI_DEFAULT_MODEL
        value: nvidia/llama-3.1-nemotron-70b-instruct
      - key: AI_OPENAI_BASE_URL
        value: https://integrate.api.nvidia.com/v1

databases:
  - name: dsir-db
    databaseName: dsir
    user: dsir_user
    plan: starter

  - name: dsir-redis
    ipAllowList: []
    plan: starter
